name: test
on: [push, pull_request]
jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: ["due", "samd21"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test
        run: |
          ./build.sh ${{ matrix.profile }}
  host-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
      - name: Host unit tests + coverage (Docker)
        run: |
          ./test/host/run_tests.sh
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-test-coverage
          path: test/host/coverage/coverage.xml
          if-no-files-found: warn
