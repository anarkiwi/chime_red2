name: Periodic tests
on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

concurrency:
  group: periodic
  cancel-in-progress: true
jobs:
  test-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: ["due", "samd21"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test
        run: |
          ./build.sh ${{ matrix.profile }}
