name: Periodic tests
on:
  schedule:
    # NZST = UTC + 12
    # Schedule to run at midnight & lunch-time
    - cron: '0 0,12 * * *'
jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: ["due", "samd21"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test
        run: |
          ./build.sh ${{ matrix.profile }}
